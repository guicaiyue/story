[http]
host = "0.0.0.0"
port = 3000
timeout = 60

[pg]
maxidleconn = 0
maxopenconn = 10
conntimeout = 10
single = false
cache = false

[auth]
enabled = false

[jwt]
default = false

[access]
restrict = false

[cors]
alloworigin = ["*"]
allowheaders = ["Accept", "Content-Type"]
allowmethods = ["GET", "OPTIONS"]
allowcredentials = false

[studio]
enabled = false
