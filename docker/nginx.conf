server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源长缓存
    location ~* \.(css|js|woff2?|ttf|png|jpg|jpeg|gif|svg|ico|moc|mtn|json)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
