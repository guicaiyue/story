# 小故事铺 2.0 · 生产 nginx 反代【可选样例】
#
# 默认**不启用**。只有当你不想用 traefik label、想用一个 nginx 统一对外时才用：
#   docker compose --env-file .env.prod -f docker-compose.prod.yml \
#     --profile nginx-front up -d
#
# ⚠️ 启用前必须把 docker-compose.prod.yml 里 server/admin 的 traefik router label
#    去掉（否则同一域名两套 router 冲突）。
#
# 职责与 apps/admin/nginx.conf 的分工：
#   - 本文件负责「按域名分流」：api-story.* → server，admin-story.* → admin；
#   - admin 容器自己的 nginx 仍负责静态文件与它内部的 /api 反代（同源形态不变）。
#
# 域名解析用 Docker 内置 DNS（127.0.0.11）+ 变量，理由同 apps/admin/nginx.conf：
# 启动时对端可能还没起来，写死 upstream 名会 "host not found in upstream" 直接启动失败。

# ---- API：api-story.xirizhi.cn ----
server {
    listen 80;
    server_name api-story.xirizhi.cn;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://story-server-prod:3000;
        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # Range/If-* 必须透传：音频接口靠 Range 支持 seek。
        proxy_set_header Range             $http_range;
        proxy_set_header If-Range          $http_if_range;

        # 音频首次实时 TTS 合成需 7–30 秒，超时要放宽；响应体大，关缓冲。
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;

        client_max_body_size 20m;
    }
}

# ---- 后台：admin-story.xirizhi.cn ----
server {
    listen 80;
    server_name admin-story.xirizhi.cn;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $admin_upstream http://story-admin-prod:80;
        proxy_pass $admin_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # 后台要上传正文（单篇可达数万字）。
        client_max_body_size 20m;
    }
}
