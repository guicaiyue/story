# 小故事铺（story）的流水线适配。通用层（pipeline-dev / -check / -release / -refactor）只读这里。
# 键名与写法照母本 ~/work/dotfiles/ai/pipeline/pipeline.conf.example；值必须是本仓库真实存在的命令。
project      = story
repo         = guicaiyue/story
prefix       = story                  # 事件类型：story.develop / .check / .publish / .refactor.signal

# 门禁只有一处定义：scripts/gate.sh（两端类型检查 + 后台单测；服务端 136 用例要开发库）。
# 这里只写「怎么调用它」，不抄命令本体，也不写死用例数——数字会随提交变。
gate         = ./scripts/gate.sh
gate_base    = 以 gate 实际输出为准（server/admin 类型检查 0 错、后台 63 用例全绿；服务端用例缺开发库时是 SKIP，不是通过）

# 后台界面改动的构建验证（母本里的「界面回归命令」）。没有快照/像素回归工具，只有 vite 构建。
ui_cmd       = pnpm --filter @story/admin build
ui_viewports = 1440, 390

# 上线通道：推 main 就是发布，镜像由 CI 构建，装版本由 NAS 的「小故事铺：自动上线」做。
deploy       = git push origin main → ci.yml（check/image/deploy）→ story.deploy → NAS
docs         = README.md, AGENTS.md, docs/README.md, docs/product/04-dev-log.md, docs/plan
danger       = 生产库写操作, 迁移, 发布链路, 签名材料, .env.prod

# ── 结构信号触发器（scripts/refactor-signal.sh 读这里）
# 只算三端源码目录：docs / scripts / config / lock 涨了不该惊动结构治理。
refactor_window_days   = 90
refactor_source_dirs   = apps/server/src,apps/admin/src,apps/app/lib
refactor_layers        = apps/server/src/routes,apps/admin/src/pages,apps/app/lib/screens
refactor_steps         = 15000,25000,40000,70000   # 源码行数档位，跨过才触发（2026-11-28 实测约 12k，所以现在不跳档）
refactor_baseline      = .refactor-baseline.json
