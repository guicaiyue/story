name: CI

# 1.0 静态站已于 2026-11-14 彻底删除（决策 D9 的最终形态），四个契约测试
# （umami 埋点 / pREST 参数编码 / analytics 队列 / EdgeTTS 生命周期）测的都是
# 1.0 的 js/ 与 index.html，随之一起删除。
#
# 现在 CI 只做 2.0 的静态检查：类型检查 + 后台单元测试。
# 服务端测试需要 Postgres，CI 里没有库，所以不在这里跑 —— 它在 NAS 的
# preflight（story-preflight.timer 每 6 小时）里跑，那才是真正的门禁。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --registry https://registry.npmjs.org

      - name: Typecheck server
        run: pnpm --filter @story/server typecheck

      - name: Typecheck admin
        run: pnpm --filter @story/admin typecheck

      - name: Admin unit tests
        run: pnpm --filter @story/admin test

  # 只有 main 的推送才上线（PR 只跑测试）。测试通过后叫中台部署 web 后台 + 后端服务。
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: guicaiyue/nas-ops/.github/workflows/notify-autoloop.yml@main
    with:
      event_type: deploy.requested
      subject: guicaiyue/story
      sha: ${{ github.sha }}
      ref: ${{ github.ref }}
      message: main 测试通过
      wait_seconds: 900
    secrets:
      AUTOLOOP_HOOK_URL: ${{ secrets.AUTOLOOP_HOOK_URL }}
      AUTOLOOP_SOURCE_KEY: ${{ secrets.AUTOLOOP_SOURCE_KEY }}

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 发上线事件并等结果
        env:
          HUB: ${{ secrets.AUTOLOOP_HOOK_URL }}
          KEY: ${{ secrets.AUTOLOOP_SOURCE_KEY }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          MSG: main 测试通过
          WAIT: "900"
          UA: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36
        run: |
          set -euo pipefail
          [ -n "$HUB" ] || { echo "没有配 AUTOLOOP_HOOK_URL"; exit 1; }
          [ -n "$KEY" ] || { echo "没有配 AUTOLOOP_SOURCE_KEY"; exit 1; }
          id="deploy.requested:${GITHUB_REPOSITORY}:${SHA}"
          detail=$(jq -cn --arg repo "$GITHUB_REPOSITORY" --arg ref "$REF" --arg sha "$SHA" --arg msg "$MSG" \
            '{repo:$repo, ref:$ref, sha:$sha, message:$msg, paths:[]}')
          payload=$(jq -cn --arg id "$id" --arg type "deploy.requested" --arg subject "$GITHUB_REPOSITORY" \
            --arg summary "${GITHUB_REPOSITORY} ${SHA:0:12}" --arg detail "$detail" \
            --arg link "https://github.com/${GITHUB_REPOSITORY}/commit/${SHA}" \
            '{id:$id, type:$type, subject:$subject, summary:$summary, detail:$detail, link:$link}')
          resp=$(curl -fsS -A "$UA" -X POST "$HUB/v1/events" -H "Authorization: Bearer $KEY" \
            -H 'content-type: application/json' -d "$payload")
          echo "$resp"
          event=$(echo "$resp" | jq -r .event)
          rounds=$(( WAIT / 4 ))
          for i in $(seq 1 $rounds); do
            sleep 4
            body=$(curl -fsS -A "$UA" -H "Authorization: Bearer $KEY" "$HUB/v1/events/$event" || true)
            [ -n "$body" ] || continue
            state=$(echo "$body" | jq -r '(.runs[0].state) // "none"')
            echo "第 $i 次：state=$state"
            case "$state" in
              done|nothing)
                echo "$body" | jq -r '.runs[0].summary // ""'
                exit 0 ;;
              cancelled)
                echo "这一轮被取消了："; echo "$body" | jq -c '.runs[0]' | head -c 600; exit 1 ;;
            esac
          done
          echo "等了 $((WAIT/60)) 分钟还没结论，去中台看：$id" >&2
          exit 1
