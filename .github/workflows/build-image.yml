name: Build Story Image

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

# Serialize image publication and deployment; never cancel an in-flight release.
concurrency:
  group: story-production-release
  cancel-in-progress: false

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run contract tests
        run: |
          node test-umami-tracker.js
          node test-prest-client.js
          node test-story-analytics.js
          node test-edge-tts-analytics.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/story:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/story:latest
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger n8n Watchtower after image push
        env:
          WEBHOOK_URL: ${{ secrets.N8N_WATCHTOWER_WEBHOOK_URL }}
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/story
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK_URL" ]; then
            echo '::error::Missing N8N_WATCHTOWER_WEBHOOK_URL secret'
            exit 1
          fi
          python3 -c 'import os; print("Webhook endpoint contract:", "PASS" if os.environ["WEBHOOK_URL"] == "https://n8n.xirizhi.cn/webhook/watchtower-check-image" else "MISMATCH")'
          payload=$(jq -nc --arg image "$IMAGE" '{image:$image}')
          curl_rc=0
          status=$(curl --silent --show-error --fail-with-body \
            --connect-timeout 20 --max-time 180 \
            -H 'Content-Type: application/json' --data "$payload" \
            --dump-header response.headers \
            --output response.json --write-out '%{http_code}' "$WEBHOOK_URL") || curl_rc=$?
          if [ "$curl_rc" -ne 0 ]; then
            echo "::error::Webhook transport failed: curl=$curl_rc HTTP=$status"
            python3 -c 'import pathlib,json; h=pathlib.Path("response.headers").read_text(errors="replace") if pathlib.Path("response.headers").exists() else ""; b=pathlib.Path("response.json").read_text(errors="replace").lower() if pathlib.Path("response.json").exists() else ""; print(json.dumps({"headers":[l for l in h.splitlines() if l.lower().startswith(("http/","server:","content-type:","date:"))],"safeline_marker":"/.safeline/" in b,"challenge_marker":"challenge" in b}))'
            exit "$curl_rc"
          fi
          if [ "$status" != 200 ] && [ "$status" != 202 ]; then
            echo "::error::Unexpected webhook HTTP status: $status"
            exit 1
          fi
          jq -e --arg image "$IMAGE" '.ok == true and .image == $image' response.json > /dev/null
          {
            echo '### Watchtower deployment request accepted'
            echo "- Commit: $GITHUB_SHA"
            echo "- Image: $IMAGE"
            echo "- HTTP status: $status"
            echo '- Acceptance (including queued/deduplicated responses) is not proof of production readiness.'
            echo '- Verify the n8n execution, Watchtower update and running image revision separately.'
          } >> "$GITHUB_STEP_SUMMARY"
