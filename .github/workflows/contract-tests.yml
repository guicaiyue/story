name: Contract tests

# 1.0 静态站已于 2026-11-14 退役（决策 D9）：不再构建镜像、不再推 Docker Hub、
# 不再触发 Watchtower。原 build-image.yml 的 build-and-push 与 deploy 两个 job 已删除。
#
# 保留四个契约测试：它们锁的是外部契约（umami 埋点标签、pREST 参数编码、analytics 队列、
# EdgeTTS 生命周期），而 1.0 源码仍在仓库里留存。哪天要恢复 1.0，这四个测试是现成的安全网。
# 恢复发布链：把备份的 build-image.yml 放回来，并在 NAS 上重建 /vol1/1000/docker/story
# （配置备份在 /vol1/1000/story/backup/retire-1.0-20261114-000508/）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contract-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run contract tests
        run: |
          node test-umami-tracker.js
          node test-prest-client.js
          node test-story-analytics.js
          node test-edge-tts-analytics.js
