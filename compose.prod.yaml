services:
  story:
    image: ${STORY_IMAGE:-xirizhi/story:latest}
    container_name: story
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - traefik-public
    labels:
      - traefik.enable=true
      - traefik.http.routers.story.rule=Host(`story.xirizhi.cn`)
      - traefik.http.routers.story.entrypoints=web
      - traefik.http.services.story.loadbalancer.server.port=80

  prest:
    image: local/prest-multidb:9070bda
    container_name: story-prest
    restart: unless-stopped
    environment:
      PREST_CONF: /app/prest.toml
      DATABASE_ALIAS_1: story
      DATABASE_URL_1: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/story?sslmode=disable
    volumes:
      - ./docker/prest.toml:/app/prest.toml:ro
    expose:
      - "3000"
    networks:
      - traefik-public
      - postgres-shared
    labels:
      - traefik.enable=true
      - traefik.http.routers.story-prest.rule=Host(`story-api.xirizhi.cn`)
      - traefik.http.routers.story-prest.entrypoints=web
      - traefik.http.services.story-prest.loadbalancer.server.port=3000

networks:
  traefik-public:
    external: true
  postgres-shared:
    external: true
    name: postgres-shared
