# 小故事铺 2.0 · M4 联调栈（**不上线、不碰生产**）
#
#   docker compose -f docker-compose.m4.yml up -d
#
# 组成：
#   server  story-server:m4   Fastify API      → http://127.0.0.1:13300
#   admin   story-admin:m4    nginx 静态 + /api 反代 → http://127.0.0.1:18082
#   db      复用已有容器 story-dev-postgres（本文件**不创建**数据库）
#
# 为什么 db 是 external：开发库 story-dev-postgres 由 M1 的 dev-db.sh 从生产
# **只读**导出建成，里面有 2197 条真实内容。compose 不拥有它，也不能重建它
# ——否则会丢掉真实数据。这里只借用它的网络（dsh-dev_default）按容器名连过去。
#
# 红线（03-decisions D7）：生产库 `story` 绝不写入。本栈所有写入都落在 dev 库。

name: story-m4

services:
  # ---------------------------------------------------------------------------
  # API 服务（多阶段构建：node22 + pnpm，见 apps/server/Dockerfile）
  # ---------------------------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: story-server:m4
    container_name: story-server
    restart: unless-stopped

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      # dev 库。容器名 story-dev-postgres 由外部网络解析。
      DATABASE_URL: postgresql://storydev:storydev_local_only@story-dev-postgres:5432/story_dev
      # 联调用固定值；非本地环境必须换成长随机串（见 .env.example）。
      JWT_SECRET: ${M4_JWT_SECRET:-m4-smoke-local-only-secret-32chars}
      FIXED_SMS_CODE: ${M4_FIXED_SMS_CODE:-123456}
      LOG_LEVEL: ${M4_LOG_LEVEL:-info}
      # TTS 合成（03-decisions §11）
      TTS_VOICE: ${M4_TTS_VOICE:-zh-CN-YunxiNeural}
      TTS_RATE: ${M4_TTS_RATE:--10%}
      TTS_CHUNK_RETRIES: ${M4_TTS_CHUNK_RETRIES:-4}
      # MP3 落盘目录，对应下面的命名卷。
      AUDIO_CACHE_DIR: /data/audio-cache

    volumes:
      # 命名卷（不是宿主 bind）：本项目宿主路径含中文
      # （/vol1/1000/开发/NAS/story），宿主 bind 会引入路径转义问题；
      # 而且音频缓存是可再生的派生物（可由 TTS 重新合成），放卷里最省事。
      - story-m4-audio-cache:/data/audio-cache

    ports:
      # 3000 已被宿主上的 chromium 容器占用，所以映射到 13300。
      # 默认绑 0.0.0.0：开发容器（dsh-dev）与宿主不在同一网络命名空间，
      # 绑 127.0.0.1 时宿主能访问、开发容器不能，脚本会连不上。
      # 想收紧成仅本机：M4_BIND=127.0.0.1 docker compose ... up -d
      - "${M4_BIND:-0.0.0.0}:13300:3000"

    networks:
      - dev

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  # 运营后台（vite build → nginx:alpine，见 apps/admin/Dockerfile）
  # ---------------------------------------------------------------------------
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        # 留空 = 同源：前端请求相对路径 /api/*，由容器内 nginx 反代到 server。
        VITE_API_BASE: ""
    image: story-admin:m4
    container_name: story-admin
    restart: unless-stopped

    depends_on:
      server:
        condition: service_healthy

    ports:
      # 宿主 18082（18080 已被宿主其它服务占用）；80 也被大量占用。
      # 绑 0.0.0.0 的理由同 server。
      - "${M4_BIND:-0.0.0.0}:18082:80"

    networks:
      - dev

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  # 复用开发库所在的既有网络（由 dsh-dev 环境创建）。
  # 先确认它存在：docker network inspect dsh-dev_default
  dev:
    external: true
    name: ${M4_DEV_NETWORK:-dsh-dev_default}

volumes:
  story-m4-audio-cache:
    name: story-m4-audio-cache
