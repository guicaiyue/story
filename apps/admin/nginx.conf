# 小故事铺 2.0 · 运营后台静态层 + API 反代（M4）
#
# 后台与 server 在同一个 compose 网络里：浏览器只访问 admin 这一个源，
# /api/* 由这里反代到 server:3000。于是开发/联调阶段不需要配 CORS，
# 前端也用相对路径（apps/admin/src/api/client.ts 就是 '/api/...'）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 容器健康检查用，不打访问日志。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # -----------------------------------------------------------------------
    # /api → server:3000
    #
    # 用变量 + resolver：nginx 启动时若 server 容器还没起来，直接写死 upstream
    # 名会 "host not found in upstream" 而启动失败。走变量则把解析推迟到请求时，
    # 两个容器谁先起来都不影响（Docker 内置 DNS 是 127.0.0.11）。
    # -----------------------------------------------------------------------
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://server:3000;

        proxy_pass $api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Range/If-* 原样透传：音频接口靠 Range 支持 seek，不能被拦。
        proxy_set_header Range             $http_range;
        proxy_set_header If-Range          $http_if_range;

        # 音频是 TTS 首次实时合成（p90 内容要 7–30 秒），超时要放宽；
        # 且响应体较大，关掉缓冲让字节尽早到达播放器。
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_request_buffering off;

        # 单条故事正文可达数万字，留足请求体空间。
        client_max_body_size 20m;
    }

    # 静态资源长缓存（vite 产物文件名带内容哈希，可放心长缓存）。
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后立刻拿到新产物。
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA 兜底：前端是 BrowserRouter，任意深链都要回 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
